<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkinCancerDetector</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080d14;
      --surface: #0d1520;
      --surface2: #111d2e;
      --border: #1a2d45;
      --border2: #1e3550;
      --blue-dim: #1a3a5c;
      --blue-mid: #1e6fb5;
      --blue: #2d8fe8;
      --blue-bright: #4faef5;
      --blue-glow: rgba(45, 143, 232, 0.15);
      --text: #c8dff5;
      --text-dim: #6a8aaa;
      --text-muted: #3d5570;
      --high: #e84040;
      --high-bg: rgba(232, 64, 64, 0.08);
      --med: #e8932d;
      --med-bg: rgba(232, 147, 45, 0.08);
      --low: #2de87a;
      --low-bg: rgba(45, 232, 122, 0.08);
      --radius: 10px;
      --radius-lg: 16px;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% -10%, rgba(29, 111, 181, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 90% 80%, rgba(16, 60, 110, 0.12) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 64px;
    }

    header {
      padding: 40px 0 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border: 1.5px solid var(--blue);
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 0 16px var(--blue-glow);
    }

    .logo-mark svg {
      display: block;
    }

    .header-text h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .header-text p {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
      font-family: 'DM Mono', monospace;
    }

    .badge {
      margin-left: auto;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--blue-bright);
      border: 1px solid var(--blue-dim);
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      background: var(--blue-glow);
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 720px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .panel-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* ── Upload ── */
    #drop-zone {
      border: 1.5px dashed var(--border2);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      background: var(--surface2);
    }

    #drop-zone:hover,
    #drop-zone.drag-over {
      border-color: var(--blue);
      background: var(--blue-glow);
    }

    #drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 12px;
      border-radius: 8px;
      background: var(--blue-glow);
      border: 1px solid var(--blue-dim);
      display: grid;
      place-items: center;
    }

    .upload-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }

    .upload-sub {
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ── Image preview ── */
    #preview-wrap {
      display: none;
      margin-top: 16px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    #preview-wrap img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
    }

    .preview-clear {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(8, 13, 20, 0.75);
      border: 1px solid var(--border2);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-family: 'DM Mono', monospace;
      backdrop-filter: blur(4px);
      transition: color 0.15s;
    }

    .preview-clear:hover {
      color: var(--text);
    }

    /* ── Analyze button ── */
    #analyze-btn {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      background: var(--blue-mid);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s, transform 0.1s;
      display: none;
      letter-spacing: 0.01em;
    }

    #analyze-btn:hover {
      background: var(--blue);
    }

    #analyze-btn:active {
      transform: scale(0.99);
    }

    #analyze-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ── Loader ── */
    #loader {
      display: none;
      margin-top: 24px;
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ── Results panel ── */
    #results {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Primary result card ── */
    .result-hero {
      background: var(--surface2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .risk-badge {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .risk-HIGH {
      background: var(--high-bg);
      color: var(--high);
      border: 1px solid rgba(232, 64, 64, 0.25);
    }

    .risk-MEDIUM {
      background: var(--med-bg);
      color: var(--med);
      border: 1px solid rgba(232, 147, 45, 0.25);
    }

    .risk-LOW {
      background: var(--low-bg);
      color: var(--low);
      border: 1px solid rgba(45, 232, 122, 0.25);
    }

    .result-main h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }

    .result-main .result-code {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── Confidence ── */
    .conf-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .conf-label {
      color: var(--text-dim);
    }

    .conf-value {
      font-family: 'DM Mono', monospace;
      color: var(--blue-bright);
    }

    .bar-track {
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--blue);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mel-fill {
      background: var(--high);
    }

    /* ── Probability bars ── */
    .prob-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prob-row {
      display: grid;
      grid-template-columns: 64px 1fr 52px;
      align-items: center;
      gap: 10px;
    }

    .prob-code {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    .prob-code.is-pred {
      color: var(--blue-bright);
    }

    .prob-code.is-mel {
      color: var(--high);
    }

    .prob-val {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      text-align: right;
    }

    /* ── Urgency ── */
    .urgency-box {
      background: var(--surface2);
      border-radius: var(--radius);
      border-left: 3px solid var(--blue);
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
    }

    .urgency-box.risk-HIGH {
      border-color: var(--high);
    }

    .urgency-box.risk-MEDIUM {
      border-color: var(--med);
    }

    .urgency-box.risk-LOW {
      border-color: var(--low);
    }

    /* ── Disclaimer ── */
    .disclaimer {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .disclaimer svg {
      flex-shrink: 0;
      margin-top: 1px;
    }

    .disclaimer p {
      font-size: 11.5px;
      color: var(--text-dim);
      line-height: 1.7;
      font-family: 'DM Mono', monospace;
    }

    /* ── Error ── */
    #error-box {
      display: none;
      background: rgba(232, 64, 64, 0.06);
      border: 1px solid rgba(232, 64, 64, 0.2);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--high);
      font-size: 13px;
      margin-top: 16px;
    }

    /* ── Stat bar for mel_prob ── */
    .mel-stat {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .mel-stat-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    .mel-stat-label {
      color: var(--text-dim);
    }

    .mel-stat-value {
      font-family: 'DM Mono', monospace;
      color: var(--high);
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <div class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="6" stroke="#2d8fe8" stroke-width="1.5" />
          <circle cx="9" cy="9" r="2.5" fill="#2d8fe8" />
          <line x1="9" y1="1" x2="9" y2="4" stroke="#2d8fe8" stroke-width="1.5" stroke-linecap="round" />
          <line x1="9" y1="14" x2="9" y2="17" stroke="#2d8fe8" stroke-width="1.5" stroke-linecap="round" />
          <line x1="1" y1="9" x2="4" y2="9" stroke="#2d8fe8" stroke-width="1.5" stroke-linecap="round" />
          <line x1="14" y1="9" x2="17" y2="9" stroke="#2d8fe8" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </div>
      <div class="header-text">
        <h1>SkinCancerDetector</h1>
        <p>EfficientNetV2-S · HAM10000 · 7-class lesion classifier</p>
      </div>
      <span class="badge">DEMO · NOT FOR CLINICAL USE</span>
    </header>

    <div class="grid">

      <!-- LEFT: Upload -->
      <div class="panel">
        <div class="panel-label">Input</div>

        <div id="drop-zone">
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" />
          <div class="upload-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 11V3M9 3L6 6M9 3L12 6" stroke="#2d8fe8" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M3 13v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="#2d8fe8" stroke-width="1.5"
                stroke-linecap="round" />
            </svg>
          </div>
          <p class="upload-title">Drop a dermatoscopic image</p>
          <p class="upload-sub">JPG · PNG · WEBP</p>
        </div>

        <div id="preview-wrap">
          <img id="preview-img" src="" alt="Preview" />
          <button class="preview-clear" id="clear-btn">✕ clear</button>
        </div>

        <button id="analyze-btn">Analyze Lesion</button>

        <div id="loader">
          <div class="spinner"></div>
          <p class="loader-text">Running inference...</p>
        </div>

        <div id="error-box"></div>
      </div>

      <!-- RIGHT: Results -->
      <div class="panel">
        <div class="panel-label">Results</div>

        <div id="results">

          <!-- Hero -->
          <div class="result-hero">
            <span class="risk-badge" id="risk-badge"></span>
            <div class="result-main">
              <h2 id="lesion-name"></h2>
              <span class="result-code" id="lesion-code"></span>
            </div>
          </div>

          <!-- Confidence -->
          <div
            style="display:flex;flex-direction:column;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px">
            <div class="conf-row">
              <span class="conf-label">Confidence</span>
              <span class="conf-value" id="conf-val"></span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" id="conf-bar"></div>
            </div>
          </div>

          <!-- Melanoma probability -->
          <div class="mel-stat">
            <div class="mel-stat-header">
              <span class="mel-stat-label">Melanoma probability</span>
              <span class="mel-stat-value" id="mel-val"></span>
            </div>
            <div class="bar-track">
              <div class="bar-fill mel-fill" id="mel-bar"></div>
            </div>
          </div>

          <!-- All class probabilities -->
          <div
            style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px">
            <div class="panel-label" style="margin-bottom:12px">Class probabilities</div>
            <div class="prob-grid" id="prob-grid"></div>
          </div>

          <!-- Urgency -->
          <div class="urgency-box" id="urgency-box"></div>

          <!-- Disclaimer -->
          <div class="disclaimer">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
              <circle cx="7.5" cy="7.5" r="6.5" stroke="#6a8aaa" stroke-width="1.2" />
              <line x1="7.5" y1="5" x2="7.5" y2="8.5" stroke="#6a8aaa" stroke-width="1.2" stroke-linecap="round" />
              <circle cx="7.5" cy="10.5" r="0.6" fill="#6a8aaa" />
            </svg>
            <p id="disclaimer-text"></p>
          </div>

        </div>

        <!-- Empty state -->
        <div id="empty-state"
          style="color:var(--text-muted);font-size:13px;padding:60px 0;text-align:center;font-family:'DM Mono',monospace;">
          Upload an image to begin
        </div>
      </div>

    </div>
  </div>

  <script>
    const CLASS_LABELS = {
      akiec: 'Actinic Keratoses',
      bcc: 'Basal Cell Carcinoma',
      bkl: 'Benign Keratosis',
      df: 'Dermatofibroma',
      mel: 'Melanoma',
      nv: 'Melanocytic Nevi',
      vasc: 'Vascular Lesion',
    };

    const API = '/predict';

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const previewWrap = document.getElementById('preview-wrap');
    const previewImg = document.getElementById('preview-img');
    const clearBtn = document.getElementById('clear-btn');
    const analyzeBtn = document.getElementById('analyze-btn');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('error-box');
    const results = document.getElementById('results');
    const emptyState = document.getElementById('empty-state');

    let selectedFile = null;

    function showPreview(file) {
      selectedFile = file;
      const url = URL.createObjectURL(file);
      previewImg.src = url;
      previewWrap.style.display = 'block';
      analyzeBtn.style.display = 'block';
      errorBox.style.display = 'none';
    }

    function clearAll() {
      selectedFile = null;
      fileInput.value = '';
      previewImg.src = '';
      previewWrap.style.display = 'none';
      analyzeBtn.style.display = 'none';
      results.style.display = 'none';
      emptyState.style.display = 'block';
      errorBox.style.display = 'none';
    }

    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) showPreview(e.target.files[0]);
    });

    clearBtn.addEventListener('click', clearAll);

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) showPreview(f);
    });

    analyzeBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      analyzeBtn.disabled = true;
      loader.style.display = 'block';
      errorBox.style.display = 'none';
      results.style.display = 'none';
      emptyState.style.display = 'none';

      const form = new FormData();
      form.append('file', selectedFile);

      try {
        const resp = await fetch(API, { method: 'POST', body: form });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: resp.statusText }));
          throw new Error(err.detail || `HTTP ${resp.status}`);
        }
        const data = await resp.json();
        renderResults(data);
      } catch (err) {
        errorBox.textContent = `Error: ${err.message}`;
        errorBox.style.display = 'block';
        emptyState.style.display = 'block';
      } finally {
        loader.style.display = 'none';
        analyzeBtn.disabled = false;
      }
    });

    function renderResults(d) {
      document.getElementById('risk-badge').textContent = d.risk;
      document.getElementById('risk-badge').className = `risk-badge risk-${d.risk}`;
      document.getElementById('lesion-name').textContent = d.lesion_name;
      document.getElementById('lesion-code').textContent = d.lesion;

      const confPct = (d.confidence * 100).toFixed(1) + '%';
      document.getElementById('conf-val').textContent = confPct;
      document.getElementById('conf-bar').style.width = confPct;

      const melPct = (d.mel_prob * 100).toFixed(1) + '%';
      document.getElementById('mel-val').textContent = melPct;
      document.getElementById('mel-bar').style.width = melPct;

      const grid = document.getElementById('prob-grid');
      grid.innerHTML = '';
      const sorted = Object.entries(d.all_probs).sort((a, b) => b[1] - a[1]);
      sorted.forEach(([code, prob]) => {
        const isPred = code === d.lesion;
        const isMel = code === 'mel';
        const pct = (prob * 100).toFixed(1);
        grid.innerHTML += `
        <div class="prob-row">
          <span class="prob-code ${isPred ? 'is-pred' : ''} ${isMel ? 'is-mel' : ''}">${CLASS_LABELS[code] || code}</span>
          <div class="bar-track">
            <div class="bar-fill ${isMel ? 'mel-fill' : ''}" style="width:${pct}%"></div>
          </div>
          <span class="prob-val">${pct}%</span>
        </div>`;
      });

      const urgency = document.getElementById('urgency-box');
      urgency.textContent = d.urgency_message;
      urgency.className = `urgency-box risk-${d.risk}`;

      document.getElementById('disclaimer-text').textContent = d.disclaimer;

      emptyState.style.display = 'none';
      results.style.display = 'flex';
    }
  </script>
</body>

</html>
